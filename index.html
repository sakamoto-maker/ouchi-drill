<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="おうちドリル"><title>おうちドリル</title>
<style>body{font-family:-apple-system,"Hiragino Maru Gothic ProN",sans-serif;background:#fff8ee;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{background:#fff;border-radius:20px;padding:28px 24px;width:min(360px,88vw);box-shadow:0 4px 0 #ecdcc4;text-align:center}input[type=password]{font-size:20px;padding:12px;width:100%;box-sizing:border-box;border:2px solid #ecdcc4;border-radius:12px;margin:10px 0}button{font-size:20px;padding:12px 28px;border-radius:14px;border:0;background:#f2862f;color:#fff;font-weight:800;width:100%}#msg{min-height:1.5em;color:#a33;margin-top:10px}label{font-size:14px;color:#666}</style></head><body>
<div class="box"><div style="font-size:44px">🔐</div><h2 style="margin:6px 0">おうちドリル</h2><div>あいことばを いれてね</div>
<input id="pw" type="password" autocomplete="current-password"><label><input type="checkbox" id="rem"> このたんまつで おぼえる</label>
<p><button id="go">ひらく</button></p><div id="msg"></div></div>
<script>
(function(){
const $=i=>document.getElementById(i), ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const V=Date.now();
async function get(u,t){const r=await fetch(u+"?v="+V,{cache:"no-store"});if(!r.ok)throw new Error(u+" が見つかりません");return t?r.json():new Uint8Array(await r.arrayBuffer());}
async function open_(pw,auto){const m=$("msg");m.style.color="#666";m.textContent="ひらいています…";
 try{const kj=await get("drill-key.json",1);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(kj.salt),iterations:kj.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let priv;try{priv=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(kj.iv)},k,ub(kj.priv));}catch(e){m.style.color="#a33";m.textContent="あいことばが ちがうよ";if(auto)try{localStorage.removeItem("od-pw")}catch(_){};return;}
  if($("rem").checked)try{localStorage.setItem("od-pw",pw)}catch(_){}
  const rk=await crypto.subtle.importKey("pkcs8",priv,{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  m.textContent="よみこんでいます…";
  const b=await get("payload.bin",0); const n=(b[4]<<8)|b[5]; const wk=b.slice(6,6+n), iv=b.slice(6+n,18+n), ct=b.slice(18+n);
  const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},rk,wk);
  const ak=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},ak,ct);
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open();document.write(html);document.close();
 }catch(e){m.style.color="#a33";m.textContent="ひらけませんでした："+e.message;}}
$("go").onclick=()=>{const p=$("pw").value;if(p)open_(p,false);};$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click();};
if(!window.crypto||!crypto.subtle||!window.DecompressionStream){$("msg").textContent="このブラウザでは ひらけません";return;}
try{const s=localStorage.getItem("od-pw");if(s){$("rem").checked=true;open_(s,true);}}catch(_){}
})();
</script></body></html>
